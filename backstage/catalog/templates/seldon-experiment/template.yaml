apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-seldon-experiment
  title: New Seldon A/B Experiment
  description: >-
    Deploy a Seldon Core v2 A/B experiment (champion vs challenger MLServer
    models with a traffic split) via a GitOps PR, using the
    gitops/config/seldon-experiment chart with per-experiment overrides.
  tags:
    - inference
    - seldon
    - experiment
    - gitops
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Experiment
      required:
        - name
        - championUri
        - challengerUri
      properties:
        name:
          title: Experiment name
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 40
        championUri:
          title: Champion model storageUri
          type: string
          description: e.g. s3://<mlflow-bucket>/models/champion/model
        challengerUri:
          title: Challenger model storageUri
          type: string
          description: e.g. s3://<mlflow-bucket>/models/challenger/model
    - title: Traffic split
      properties:
        championWeight:
          title: Champion weight (%)
          type: integer
          default: 50
        challengerWeight:
          title: Challenger weight (%)
          type: integer
          default: 50
  steps:
    - id: fetch
      name: Generate the experiment manifest
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          championUri: ${{ parameters.championUri }}
          challengerUri: ${{ parameters.challengerUri }}
          championWeight: ${{ parameters.championWeight }}
          challengerWeight: ${{ parameters.challengerWeight }}
    - id: pr
      name: Open PR to Kinetics-CD
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=Kinetics-Continious-Delivery
        branchName: seldon-${{ parameters.name }}
        title: 'feat(seldon): add A/B experiment ${{ parameters.name }}'
        description: |
          Adds an ArgoCD Application for Seldon A/B experiment `${{ parameters.name }}`
          (champion ${{ parameters.championWeight }}% / challenger
          ${{ parameters.challengerWeight }}%). Generated by Backstage.
  output:
    links:
      - title: Open the pull request
        url: ${{ steps.pr.output.remoteUrl }}
