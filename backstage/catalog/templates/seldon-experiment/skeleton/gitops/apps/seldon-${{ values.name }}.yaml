---
# Generated by the Backstage "New Seldon A/B Experiment" scaffolder template.
# ArgoCD Application deploying a Seldon Core v2 experiment (Server + champion &
# challenger Models + Experiment) via the gitops/config/seldon-experiment chart.
# All resource names are overridden per-experiment so multiple experiments can
# coexist in seldon-mesh without colliding.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seldon-${{ values.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/huzaifa678/Kinetics-Continious-Delivery.git
    targetRevision: main
    path: gitops/config/seldon-experiment
    helm:
      values: |
        server:
          name: ${{ values.name }}-server
        models:
          champion:
            name: ${{ values.name }}-champion
            storageUri: ${{ values.championUri }}
          challenger:
            name: ${{ values.name }}-challenger
            storageUri: ${{ values.challengerUri }}
        experiment:
          name: ${{ values.name }}
          championWeight: ${{ values.championWeight }}
          challengerWeight: ${{ values.challengerWeight }}
  destination:
    server: https://kubernetes.default.svc
    namespace: seldon-mesh
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Seldon charts render optional fields as explicit null; client-side apply.
      - ServerSideApply=false
      - SkipDryRunOnMissingResource=true
