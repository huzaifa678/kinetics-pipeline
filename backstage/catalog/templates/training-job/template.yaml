apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-training-run
  title: New Training Run (HyperPod GPU)
  description: >-
    Spawn a Kinetics CNN-LSTM training run on the HyperPod GPU pool. Generates an
    ArgoCD Application (using the helm/training-job chart) and opens a PR to the
    Kinetics-CD repo — ArgoCD deploys the HyperPodPyTorchJob once merged.
  tags:
    - training
    - gpu
    - hyperpod
    - gitops
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Training run
      required:
        - name
        - imageTag
      properties:
        name:
          title: Run name
          type: string
          description: Lowercase DNS name; becomes the ArgoCD app + job name.
          pattern: '^[a-z0-9-]+$'
          maxLength: 40
        imageTag:
          title: Training image tag
          type: string
          description: ECR tag of the kinetics-training image (e.g. sha-6ac22f2).
          default: sha-6ac22f2
    - title: Compute + model
      properties:
        nodes:
          title: GPU nodes
          type: integer
          default: 2
        gpusPerNode:
          title: GPUs per node
          type: integer
          default: 4
        model:
          title: Model
          type: string
          default: cnn_lstm
          enum:
            - cnn_lstm
            - r2plus1d
        numClasses:
          title: Num classes
          type: integer
          default: 400
  steps:
    - id: fetch
      name: Generate the run manifest
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          imageTag: ${{ parameters.imageTag }}
          nodes: ${{ parameters.nodes }}
          gpusPerNode: ${{ parameters.gpusPerNode }}
          model: ${{ parameters.model }}
          numClasses: ${{ parameters.numClasses }}
    - id: pr
      name: Open PR to Kinetics-CD
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=Kinetics-Continious-Delivery
        branchName: training-run-${{ parameters.name }}
        title: 'feat(training): add run ${{ parameters.name }}'
        description: |
          Adds an ArgoCD Application for training run `${{ parameters.name }}`
          (image `${{ parameters.imageTag }}`, ${{ parameters.nodes }} nodes ×
          ${{ parameters.gpusPerNode }} GPUs, model `${{ parameters.model }}`).
          Generated by the Backstage scaffolder.
  output:
    links:
      - title: Open the pull request
        url: ${{ steps.pr.output.remoteUrl }}
