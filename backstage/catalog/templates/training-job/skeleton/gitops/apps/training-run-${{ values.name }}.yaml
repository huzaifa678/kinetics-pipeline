---
# Generated by the Backstage "New Training Run" scaffolder template.
# An ArgoCD Application that deploys one HyperPodPyTorchJob via the
# helm/training-job chart with per-run overrides. The Kinetics-CD app-of-apps
# (platform-standalone-apps) picks up files in gitops/apps/ and deploys them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: training-run-${{ values.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/huzaifa678/Kinetics-Continious-Delivery.git
    targetRevision: main
    path: helm/training-job
    helm:
      # Per-run overrides; everything else comes from the chart defaults.
      values: |
        image:
          tag: ${{ values.imageTag }}
        distributed:
          nodes: ${{ values.nodes }}
          gpusPerNode: ${{ values.gpusPerNode }}
        training:
          model: ${{ values.model }}
          numClasses: ${{ values.numClasses }}
  destination:
    server: https://kubernetes.default.svc
    namespace: training
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
