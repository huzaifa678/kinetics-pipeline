---
# Generated by the Backstage "New Inference Service" scaffolder template.
# ArgoCD Application deploying one FastAPI inference service (Rollout + KEDA)
# via the helm/inference-service chart with per-service overrides.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inference-${{ values.name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/huzaifa678/Kinetics-Continious-Delivery.git
    targetRevision: main
    path: helm/inference-service
    helm:
      values: |
        image:
          tag: ${{ values.imageTag }}
        autoscaling:
          enabled: true
          minReplicaCount: ${{ values.minReplicaCount }}
          maxReplicaCount: ${{ values.maxReplicaCount }}
          threshold: "${{ values.threshold }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: inference
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
