apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: new-inference-service
  title: New Inference Service (FastAPI + KEDA)
  description: >-
    Deploy a Kinetics FastAPI inference service (Argo Rollout + KEDA autoscaling)
    via a GitOps PR. Generates an ArgoCD Application using the
    helm/inference-service chart with per-service overrides.
  tags:
    - inference
    - serving
    - keda
    - gitops
spec:
  owner: group:default/platform-team
  type: service
  parameters:
    - title: Service
      required:
        - name
        - imageTag
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 40
        imageTag:
          title: Serving image tag
          type: string
          description: ECR tag of the FastAPI serving image (e.g. serve-6ac22f2).
          default: serve-6ac22f2
    - title: Autoscaling (KEDA)
      properties:
        minReplicaCount:
          title: Min replicas
          type: integer
          default: 1
        maxReplicaCount:
          title: Max replicas
          type: integer
          default: 5
        threshold:
          title: Target requests/sec per replica
          type: integer
          default: 20
  steps:
    - id: fetch
      name: Generate the service manifest
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          imageTag: ${{ parameters.imageTag }}
          minReplicaCount: ${{ parameters.minReplicaCount }}
          maxReplicaCount: ${{ parameters.maxReplicaCount }}
          threshold: ${{ parameters.threshold }}
    - id: pr
      name: Open PR to Kinetics-CD
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=huzaifa678&repo=Kinetics-Continious-Delivery
        branchName: inference-${{ parameters.name }}
        title: 'feat(inference): add service ${{ parameters.name }}'
        description: |
          Adds an ArgoCD Application for inference service `${{ parameters.name }}`
          (image `${{ parameters.imageTag }}`, KEDA ${{ parameters.minReplicaCount }}–${{ parameters.maxReplicaCount }}
          replicas @ ${{ parameters.threshold }} rps/replica). Generated by Backstage.
  output:
    links:
      - title: Open the pull request
        url: ${{ steps.pr.output.remoteUrl }}
